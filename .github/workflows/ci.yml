name: CI

on:
  push:
    branches: [main, develop, python3-porting]
  pull_request:
    branches: [main, develop, python3-porting]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv venv
          ./venv/bin/pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          ./venv/bin/flake8 src/gmv

      - name: Run smoke tests (import/port validation, no Gmail needed)
        run: |
          ./venv/bin/pytest -o python_files="*_smoke_tests.py" --cov=gmv --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
